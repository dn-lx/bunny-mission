<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Bunny Mission form definitions</title>
</head>
<body>
  <form name="going-out-develop" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="going-out-develop">
    <input type="text" name="bot-field">
        <textarea name="reply"></textarea>
        <input type="hidden" name="decision">
    <input type="hidden" name="subject" value="Alex received a bunny invitation response">
    <button type="submit">Send</button>
  </form>
</body>
</html>
