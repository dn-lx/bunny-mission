[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

# The guest app is a static Next.js export. Protected server operations stay in Netlify Functions.
# Keep the develop branch deploy isolated from the main production branch.
[context.develop.environment]
  DEPLOY_CHANNEL = "develop"

[[redirects]]
  from = "/voice-preview.html"
  to = "/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
