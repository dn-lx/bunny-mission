[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Development deploy settings. Enable the develop branch in Netlify > Continuous deployment > Branch deploys.
# The assigned deploy URL follows the Netlify site slug, which is separate from the GitHub repository name.
[context.develop]
  publish = "public"
  [context.develop.environment]
    DEPLOY_CHANNEL = "develop"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
