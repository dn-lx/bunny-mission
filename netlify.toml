[build]
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Netlify's managed OpenNext adapter detects Next.js and configures its runtime.
# Keep the develop branch deploy isolated from the main production branch.
[context.develop.environment]
  DEPLOY_CHANNEL = "develop"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
